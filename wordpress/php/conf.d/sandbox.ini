expose_php=Off
display_errors=Off
log_errors=On
error_log=/var/log/sandbox/php/php-error.log
allow_url_fopen=On
allow_url_include=On
disable_functions=
memory_limit=256M
max_execution_time=120
upload_max_filesize=64M
post_max_size=64M
openssl.cafile=/gateway-ca/mitmproxy-ca-cert.pem
curl.cainfo=/gateway-ca/mitmproxy-ca-cert.pem
