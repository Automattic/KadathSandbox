expose_php=Off
display_errors=Off
log_errors=On
error_log=/var/log/sandbox/php/php-error.log
allow_url_fopen=On
allow_url_include=On
; Anti-analysis only. Nothing here is something a sample needs to do its own work;
; every entry exists purely so the sample cannot switch off the Xdebug trace that is
; recording it. Xdebug still traces automatically (start_with_request=yes); only the
; runtime controls are gone.
disable_functions=xdebug_stop_trace,xdebug_start_trace,xdebug_set_filter,xdebug_get_tracefile_name,xdebug_get_function_stack
memory_limit=256M
max_execution_time=120
upload_max_filesize=64M
post_max_size=64M
openssl.cafile=/gateway-ca/mitmproxy-ca-cert.pem
curl.cainfo=/gateway-ca/mitmproxy-ca-cert.pem
