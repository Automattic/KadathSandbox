[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /run/php/php-fpm.sock
listen.mode = 0660
pm = static
pm.max_children = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Observation keys, pinned for the pool. The sample and php-fpm are the same uid (33), so
; anything that is PHP_INI_ALL or PHP_INI_PERDIR is the sample's to change: ini_set() at
; runtime, or a dropped .user.ini in the docroot. php_admin_value / php_admin_flag are
; final for the pool -- neither ini_set() nor a per-directory file can override them. This
; is the layer below Snuffleupagus's ini_protection (which pins error_log only); here we
; also pin what the Xdebug trace and the PHP Fatal lines the stub engine relies on depend
; on, and empty auto_prepend_file / auto_append_file so nothing can be injected ahead of
; or after every request, the analyst's included. The values mirror conf.d/xdebug.ini and
; conf.d/sandbox.ini, which stay as they are because the CLI `wp` has no pool.
php_admin_value[error_log] = /var/log/sandbox/php/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[xdebug.start_with_request] = yes
php_admin_value[xdebug.output_dir] = /var/log/sandbox/xdebug
php_admin_value[xdebug.trace_output_name] = trace.%t.%r
php_admin_value[xdebug.trace_format] = 1
php_admin_value[xdebug.collect_return] = 1
php_admin_value[xdebug.collect_assignments] = 1
php_admin_value[xdebug.var_display_max_data] = 65536
php_admin_value[xdebug.var_display_max_depth] = 2
php_admin_value[xdebug.var_display_max_children] = 32
php_admin_value[xdebug.max_nesting_level] = 1024
php_admin_value[auto_prepend_file] =
php_admin_value[auto_append_file] =
