pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/sandbox/php/nginx-access.log;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;
    client_max_body_size 64m;
    server_tokens off;

    server {
        listen 8080;
        # WP_URL is http://127.0.0.1:8088 (8080 is taken on the analyst host, so Docker
        # publishes 8088->8080). WordPress's own loopback requests -- wp-cron above all --
        # go to WP_URL literally, from inside this namespace, so nginx has to answer on
        # 8088 as well or cron never fires. netguard only accepts NEW on 8088 over lo;
        # inbound 8088 on the mgmt interface stays dropped.
        listen 8088;
        root /var/www/html;
        index index.php index.html;

        location = /healthz { return 200 "ok\n"; }

        location / { try_files $uri $uri/ /index.php?$args; }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Debian's packaged fastcgi_params derives HTTP_HOST from $host (port stripped) as a
            # hardening default. This sandbox's WP_URL uses a non-default port (127.0.0.1:8088),
            # so a port-stripped Host causes WordPress's redirect_canonical() to see every request
            # as off-host and 301-loop. Restore the client-supplied Host, port included.
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_read_timeout 300;
        }
    }
}
